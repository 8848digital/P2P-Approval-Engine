<style>
	:root {
		--vp-sidebar-w: 240px;
		--vp-accent: #4f46e5;
		--vp-accent-soft: rgba(79, 70, 229, 0.1);
	}
	body {
		background-color: var(--bg-light-gray);
	}

	.vp-app {
		display: flex;
		min-height: 100vh;
	}

	/* ---------- Sidebar ---------- */
	.vp-sidebar {
		width: var(--vp-sidebar-w);
		flex-shrink: 0;
		background-color: var(--bg-color);
		border-right: 1px solid var(--border-color);
		position: sticky;
		top: 0;
		height: 100vh;
		display: flex;
		flex-direction: column;
	}
	.vp-sidebar-brand {
		display: flex;
		align-items: center;
		gap: 0.6rem;
		padding: 1.25rem 1.25rem 1rem;
		text-decoration: none;
	}
	.vp-sidebar-brand-icon {
		width: 34px;
		height: 34px;
		border-radius: 10px;
		background: linear-gradient(135deg, var(--vp-accent), #7c6ff0);
		display: flex;
		align-items: center;
		justify-content: center;
		color: #fff;
		font-weight: 700;
		font-size: 15px;
		flex-shrink: 0;
	}
	.vp-sidebar-brand-text {
		min-width: 0;
	}
	.vp-sidebar-brand-name {
		font-weight: var(--weight-semibold);
		font-size: var(--text-base);
		color: var(--text-color);
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	.vp-sidebar-brand-tag {
		font-size: 11px;
		color: var(--text-light);
		text-transform: uppercase;
		letter-spacing: 0.05em;
	}

	.vp-sidebar-nav {
		flex: 1;
		padding: 0.5rem 0.75rem;
		display: flex;
		flex-direction: column;
		gap: 2px;
		overflow-y: auto;
	}
	.vp-sidebar-nav a {
		display: flex;
		align-items: center;
		gap: 0.7rem;
		padding: 0.55rem 0.75rem;
		border-radius: var(--border-radius);
		color: var(--text-light);
		text-decoration: none;
		font-size: var(--text-sm);
		font-weight: 500;
	}
	.vp-sidebar-nav a svg {
		width: 17px;
		height: 17px;
		stroke: currentColor;
		flex-shrink: 0;
	}
	.vp-sidebar-nav a:hover {
		background-color: var(--bg-light-gray);
		color: var(--text-color);
		text-decoration: none;
	}
	.vp-sidebar-nav a.active {
		background-color: var(--vp-accent-soft);
		color: var(--vp-accent);
		font-weight: var(--weight-semibold);
	}

	.vp-sidebar-footer {
		padding: 0.75rem;
		border-top: 1px solid var(--border-color);
	}
	.vp-sidebar-footer a {
		display: flex;
		align-items: center;
		gap: 0.7rem;
		padding: 0.55rem 0.75rem;
		border-radius: var(--border-radius);
		color: var(--text-light);
		text-decoration: none;
		font-size: var(--text-sm);
	}
	.vp-sidebar-footer a:hover {
		background-color: var(--bg-light-gray);
		color: var(--text-color);
		text-decoration: none;
	}
	.vp-sidebar-footer a svg {
		width: 17px;
		height: 17px;
		stroke: currentColor;
	}

	/* ---------- Main column ---------- */
	.vp-main {
		flex: 1;
		min-width: 0;
	}
	.vp-shell {
		padding: 2.5rem 2rem 4rem;
	}

	.vp-page-header {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		flex-wrap: wrap;
		gap: 0.5rem;
		margin-bottom: 1.75rem;
	}
	.vp-page-title {
		font-size: 1.7rem;
		font-weight: 700;
		color: var(--text-color);
		letter-spacing: -0.01em;
	}
	.vp-page-subtitle {
		color: var(--text-light);
		font-size: var(--text-sm);
		margin-top: 2px;
	}

	/* ---------- Tabs (list page, when a Vendor Portal DocType row has a
	   Tab Group set -- e.g. Purchase Orders / Purchase Invoices merged
	   into one "Orders & Invoices" sidebar item). Plain links, not JS --
	   switching tabs is a normal navigation to that tab's own route, kept
	   visually seamless since it's the same page shell/header around it. */
	.vp-tabs {
		display: flex;
		gap: 0.25rem;
		border-bottom: 1px solid var(--border-color);
		margin: -0.75rem 0 1.5rem;
	}
	.vp-tab {
		padding: 0.6rem 0.9rem;
		font-size: var(--text-sm);
		font-weight: 600;
		color: var(--text-light);
		text-decoration: none;
		border-bottom: 2px solid transparent;
		margin-bottom: -1px;
	}
	.vp-tab:hover {
		color: var(--text-color);
		text-decoration: none;
	}
	.vp-tab.active {
		color: var(--vp-accent);
		border-bottom-color: var(--vp-accent);
	}

	/* ---------- List toolbar: search + sort (list page) ---------- */
	.vp-list-toolbar {
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 1rem;
		flex-wrap: wrap;
		margin-bottom: 1.25rem;
	}
	.vp-search-form {
		position: relative;
		display: flex;
		align-items: center;
		flex: 1;
		max-width: 320px;
	}
	.vp-search-icon-btn {
		position: absolute;
		left: 0.5rem;
		display: flex;
		align-items: center;
		justify-content: center;
		width: 22px;
		height: 22px;
		background: none;
		border: none;
		padding: 0;
		color: var(--text-light);
		cursor: pointer;
	}
	.vp-search-icon-btn:hover {
		color: var(--vp-accent);
	}
	.vp-search-icon {
		width: 15px;
		height: 15px;
		stroke: currentColor;
	}
	.vp-search-input {
		width: 100%;
		padding: 0.5rem 2rem 0.5rem 2.1rem;
		border: 1px solid var(--border-color);
		border-radius: var(--border-radius);
		background-color: var(--bg-color);
		color: var(--text-color);
		font-size: var(--text-sm);
	}
	.vp-search-input:focus {
		outline: none;
		border-color: var(--vp-accent);
	}
	.vp-search-clear {
		position: absolute;
		right: 0.6rem;
		display: flex;
		align-items: center;
		justify-content: center;
		width: 18px;
		height: 18px;
		color: var(--text-light);
	}
	.vp-search-clear:hover {
		color: var(--text-color);
	}
	.vp-search-clear svg {
		width: 14px;
		height: 14px;
		stroke: currentColor;
	}
	.vp-sort-toggle {
		display: inline-flex;
		align-items: center;
		gap: 0.4rem;
		flex-shrink: 0;
		padding: 0.5rem 0.9rem;
		border: 1px solid var(--border-color);
		border-radius: var(--border-radius);
		background-color: var(--bg-color);
		color: var(--text-color);
		font-size: var(--text-sm);
		font-weight: 500;
		text-decoration: none;
		white-space: nowrap;
	}
	.vp-sort-toggle:hover {
		border-color: var(--vp-accent);
		color: var(--vp-accent);
		text-decoration: none;
	}
	.vp-sort-toggle svg {
		width: 15px;
		height: 15px;
		stroke: currentColor;
	}
	.vp-back-link {
		color: var(--text-light);
		text-decoration: none;
		font-size: var(--text-sm);
		display: inline-flex;
		align-items: center;
		gap: 0.3rem;
		margin-bottom: 1rem;
		font-weight: 500;
	}
	.vp-back-link:hover {
		color: var(--vp-accent);
		text-decoration: none;
	}
	.vp-back-link svg {
		width: 15px;
		height: 15px;
	}

	/* ---------- Stat cards ---------- */
	.vp-stats-row {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
		gap: 1rem;
		margin-bottom: 2rem;
	}
	.vp-stat-card {
		background-color: var(--bg-color);
		border: 1px solid var(--border-color);
		border-radius: 14px;
		padding: 1.25rem 1.4rem;
		text-decoration: none;
		display: block;
		transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
	}
	.vp-stat-card:hover {
		box-shadow: var(--shadow-lg);
		transform: translateY(-2px);
		border-color: var(--vp-accent);
		text-decoration: none;
	}
	.vp-stat-icon {
		width: 38px;
		height: 38px;
		border-radius: 10px;
		display: flex;
		align-items: center;
		justify-content: center;
		margin-bottom: 0.9rem;
	}
	.vp-stat-icon svg {
		width: 19px;
		height: 19px;
		stroke: currentColor;
	}
	.vp-stat-icon.vp-tone-indigo { background: var(--vp-accent-soft); color: var(--vp-accent); }
	.vp-stat-icon.vp-tone-green { background: rgba(16, 163, 74, 0.1); color: #10a34a; }
	.vp-stat-icon.vp-tone-orange { background: rgba(230, 119, 0, 0.1); color: #e67700; }
	.vp-stat-icon.vp-tone-blue { background: rgba(28, 126, 214, 0.1); color: #1c7ed6; }
	.vp-stat-value {
		font-size: 1.6rem;
		font-weight: 700;
		color: var(--text-color);
		line-height: 1.1;
	}
	.vp-stat-label {
		color: var(--text-light);
		font-size: var(--text-sm);
		margin-top: 3px;
	}

	/* ---------- Cards / lists ---------- */
	.vp-card {
		background-color: var(--bg-color);
		border: 1px solid var(--border-color);
		border-radius: 14px;
	}

	.vp-list {
		display: flex;
		flex-direction: column;
		gap: 0.6rem;
	}
	.vp-list-row {
		display: flex;
		align-items: center;
		gap: 1rem;
		padding: 1rem 1.25rem;
		border-radius: 12px;
		border: 1px solid var(--border-color);
		background-color: var(--bg-color);
		text-decoration: none;
		color: inherit;
		transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
	}
	.vp-list-row:hover {
		box-shadow: var(--shadow-lg);
		transform: translateY(-1px);
		border-color: var(--vp-accent);
		text-decoration: none;
		color: inherit;
	}
	.vp-list-icon {
		width: 40px;
		height: 40px;
		border-radius: 10px;
		background: var(--bg-light-gray);
		display: flex;
		align-items: center;
		justify-content: center;
		flex-shrink: 0;
		color: var(--text-light);
	}
	.vp-list-icon svg {
		width: 18px;
		height: 18px;
		stroke: currentColor;
	}
	.vp-list-main {
		flex: 1;
		min-width: 0;
	}
	.vp-list-title {
		font-weight: var(--weight-semibold);
		color: var(--text-color);
		font-size: var(--text-base);
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	.vp-list-sub {
		color: var(--text-light);
		font-size: var(--text-sm);
		margin-top: 3px;
		display: flex;
		align-items: center;
		gap: 0.4rem;
		flex-wrap: wrap;
	}
	.vp-list-amount {
		font-weight: 700;
		color: var(--text-color);
		font-size: var(--text-base);
		white-space: nowrap;
		text-align: right;
	}
	.vp-list-date {
		color: var(--text-light);
		font-size: var(--text-sm);
		white-space: nowrap;
		min-width: 90px;
		text-align: right;
	}
	.vp-list-chevron {
		color: var(--text-light);
		flex-shrink: 0;
	}
	.vp-list-chevron svg {
		width: 16px;
		height: 16px;
		stroke: currentColor;
	}

	.vp-empty {
		padding: 4rem 1rem;
		text-align: center;
		color: var(--text-light);
		border: 1px dashed var(--border-color);
		border-radius: 14px;
	}
	.vp-empty svg {
		width: 32px;
		height: 32px;
		stroke: currentColor;
		opacity: 0.5;
		margin-bottom: 0.75rem;
	}

	.vp-pill {
		display: inline-flex;
		align-items: center;
		padding: 3px 11px;
		border-radius: 999px;
		font-size: 12px;
		font-weight: var(--weight-semibold);
		white-space: nowrap;
	}
	.vp-pill-green { background: rgba(16, 163, 74, 0.12); color: #10a34a; }
	.vp-pill-orange { background: rgba(230, 119, 0, 0.12); color: #e67700; }
	.vp-pill-red { background: rgba(224, 49, 49, 0.12); color: #e03131; }
	.vp-pill-gray { background: var(--bg-light-gray); color: var(--text-light); }
	.vp-pill-blue { background: rgba(28, 126, 214, 0.12); color: #1c7ed6; }

	/* ---------- Detail page ---------- */
	.vp-detail-header {
		padding: 1.5rem 1.75rem;
		border-bottom: 1px solid var(--border-color);
		display: flex;
		align-items: flex-start;
		justify-content: space-between;
		flex-wrap: wrap;
		gap: 0.75rem;
	}
	.vp-detail-title {
		font-size: 1.4rem;
		font-weight: 700;
		color: var(--text-color);
		letter-spacing: -0.01em;
	}
	.vp-detail-sub {
		color: var(--text-light);
		font-size: var(--text-sm);
		margin-top: 3px;
	}

	.vp-kv-grid {
		display: grid;
		grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
		gap: 1.25rem;
		padding: 1.5rem 1.75rem;
		border-bottom: 1px solid var(--border-color);
	}
	.vp-kv-label {
		color: var(--text-light);
		font-size: 12px;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		margin-bottom: 4px;
	}
	.vp-kv-value {
		color: var(--text-color);
		font-size: var(--text-base);
		font-weight: var(--weight-semibold);
	}

	.vp-table-wrap {
		overflow-x: auto;
	}
	.vp-table {
		width: 100%;
		border-collapse: collapse;
	}
	.vp-table th {
		text-align: left;
		font-size: 12px;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		color: var(--text-light);
		font-weight: var(--weight-semibold);
		padding: 0.75rem 1.75rem;
		border-bottom: 1px solid var(--border-color);
		white-space: nowrap;
	}
	.vp-table td {
		padding: 0.75rem 1.75rem;
		border-bottom: 1px solid var(--border-color);
		font-size: var(--text-sm);
		color: var(--text-color);
	}
	.vp-table tr:last-child td {
		border-bottom: none;
	}
	.vp-table th.vp-num,
	.vp-table td.vp-num {
		text-align: right;
		white-space: nowrap;
	}

	.vp-totals {
		padding: 1.25rem 1.75rem;
		display: flex;
		justify-content: flex-end;
	}
	.vp-totals-box {
		min-width: 240px;
	}
	.vp-totals-row {
		display: flex;
		justify-content: space-between;
		font-size: var(--text-sm);
		color: var(--text-light);
		padding: 0.25rem 0;
	}
	.vp-totals-row.vp-grand {
		color: var(--text-color);
		font-weight: 700;
		font-size: 1.05rem;
		border-top: 1px solid var(--border-color);
		margin-top: 0.5rem;
		padding-top: 0.6rem;
	}

	/* ---------- Linked documents (detail page, e.g. Purchase Invoices
	   raised against a Purchase Order) ---------- */
	.vp-linked-documents {
		padding: 1.5rem 1.75rem;
		border-top: 1px solid var(--border-color);
	}
	.vp-linked-documents-title {
		font-size: 12px;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		color: var(--text-light);
		font-weight: var(--weight-semibold);
		margin-bottom: 0.75rem;
	}

	/* ---------- Invoice attachment (detail page) ---------- */
	.vp-invoice-attach {
		padding: 1.5rem 1.75rem;
		border-top: 1px solid var(--border-color);
	}
	.vp-invoice-attach-title {
		font-size: 12px;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		color: var(--text-light);
		font-weight: var(--weight-semibold);
		margin-bottom: 0.75rem;
	}
	.vp-invoice-attach-list {
		display: flex;
		flex-direction: column;
		gap: 0.4rem;
		margin-bottom: 1rem;
	}
	.vp-invoice-attach-file {
		display: inline-flex;
		align-items: center;
		gap: 0.5rem;
		color: var(--vp-accent);
		text-decoration: none;
		font-size: var(--text-sm);
		font-weight: 500;
	}
	.vp-invoice-attach-file:hover {
		text-decoration: underline;
	}
	.vp-invoice-attach-file svg {
		width: 15px;
		height: 15px;
		stroke: currentColor;
		flex-shrink: 0;
	}
	.vp-invoice-attach-empty {
		color: var(--text-light);
		font-size: var(--text-sm);
	}
	.vp-invoice-attach-form {
		display: flex;
		align-items: center;
		gap: 0.75rem;
		flex-wrap: wrap;
	}
	.vp-invoice-attach-form input[type="file"] {
		font-size: var(--text-sm);
		color: var(--text-color);
		max-width: 100%;
	}
	.vp-invoice-attach-error {
		color: #e03131;
		font-size: var(--text-sm);
		width: 100%;
	}

	/* ---------- Buttons ---------- */
	.vp-btn {
		display: inline-flex;
		align-items: center;
		gap: 0.4rem;
		padding: 0.5rem 1rem;
		border-radius: var(--border-radius);
		background: var(--vp-accent);
		color: #fff;
		font-size: var(--text-sm);
		font-weight: var(--weight-semibold);
		text-decoration: none;
		border: none;
	}
	.vp-btn:hover {
		background: #4338ca;
		color: #fff;
		text-decoration: none;
	}
	.vp-btn svg {
		width: 15px;
		height: 15px;
		stroke: currentColor;
	}

	/* ---------- Profile ---------- */
	.vp-avatar {
		width: 56px;
		height: 56px;
		border-radius: 14px;
		background: linear-gradient(135deg, var(--vp-accent), #7c6ff0);
		color: #fff;
		display: flex;
		align-items: center;
		justify-content: center;
		font-weight: 700;
		font-size: 1.3rem;
		flex-shrink: 0;
	}

	/* ---------- Mobile ---------- */
	@media (max-width: 820px) {
		.vp-app { flex-direction: column; }
		.vp-sidebar {
			width: 100%;
			height: auto;
			position: static;
			flex-direction: row;
			align-items: center;
			overflow-x: auto;
		}
		.vp-sidebar-brand { padding: 0.75rem 1rem; }
		.vp-sidebar-nav { flex-direction: row; padding: 0.5rem; }
		.vp-sidebar-nav a span { display: none; }
		.vp-sidebar-footer { border-top: none; border-left: 1px solid var(--border-color); }
		.vp-shell { padding: 1.5rem 1.25rem 3rem; }
	}
</style>

<div class="web-list-item transaction-list-item">
	<div class="row align-items-center">

		<div class="col-sm-4">
			<!-- <span class="list-item-name font-weight-bold">
				{{ doc.name }}
			</span> -->

			<div class="small text-muted transaction-time"
				title="{{ frappe.utils.format_datetime(doc.modified, 'medium') }}">
				{{ frappe.utils.global_date_format(doc.modified) }}
			</div>
		</div>

		{% if doc.requisition_type %}
		<div class="col-sm-3">
			<span class="indicator-pill {{ doc.indicator_color }}">
				{{ doc.requisition_type }}
			</span>
		</div>
		{% endif %}

		<div class="col-sm-2">
			<div class="small text-muted items-preview ellipsis ellipsis-width">
				{{ doc.items_preview }}
			</div>
		</div>

		<div class="col-sm-3 text-right font-weight-bold item-total">
			₹ {{ frappe.utils.fmt_money(doc.total_amount) }}
		</div>

	</div>

	<a class="transaction-item-link"
	   href="/brn/{{ doc.name }}">
		Link
	</a>
</div>
